{{define "base"}}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{.Title}} - WikiKeeper</title>
        <script src="https://unpkg.com/htmx.org@2.0.4"></script>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            .htmx-indicator {
                display: none;
            }
            .htmx-request .htmx-indicator {
                display: inline-block;
            }
            .htmx-request.htmx-indicator {
                display: inline-block;
            }
            .fade-in {
                animation: fadeIn 0.2s ease-in;
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }
        </style>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            primary: {
                                50: "#eff6ff",
                                100: "#dbeafe",
                                200: "#bfdbfe",
                                300: "#93c5fd",
                                400: "#60a5fa",
                                500: "#3b82f6",
                                600: "#2563eb",
                                700: "#1d4ed8",
                                800: "#1e40af",
                                900: "#1e3a8a",
                            },
                        },
                    },
                },
            };
        </script>
        {{block "head" .}}{{end}}
    </head>
    <body class="bg-gray-50 min-h-screen flex flex-col">
        <nav
            class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-40"
        >
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-14">
                    <div class="flex items-center space-x-8">
                        <a href="/" class="text-lg font-bold text-primary-600"
                            >WikiKeeper</a
                        >
                        <div class="hidden sm:flex space-x-1">
                            <a
                                href="/"
                                class="px-3 py-2 rounded text-sm font-medium text-gray-700 hover:bg-gray-100"
                                >Dashboard</a
                            >
                            <a
                                href="/wikis"
                                class="px-3 py-2 rounded text-sm font-medium text-gray-700 hover:bg-gray-100"
                                >Wikis</a
                            >
                            <a
                                href="/extensions"
                                class="px-3 py-2 rounded text-sm font-medium text-gray-700 hover:bg-gray-100"
                                >Extensions</a
                            >
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        {{if .IsAdmin}}
                        <span
                            class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded font-medium"
                            >Admin</span
                        >
                        <form method="post" action="/logout">
                            <button type="submit" class="text-xs text-gray-500 hover:text-gray-700">Logout</button>
                        </form>
                        {{else}}
                        <a href="/login" class="text-xs text-gray-500 hover:text-gray-700">Login</a>
                        {{end}}
                        <a
                            href="https://github.com/saveweb/wikikeeper"
                            class="text-gray-400 hover:text-gray-600"
                            target="_blank"
                        >
                            <svg
                                class="w-5 h-5"
                                fill="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
                                />
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            {{block "content" .}}{{end}}
        </main>

        <footer class="bg-white border-t border-gray-200 mt-auto">
            <div
                class="max-w-7xl mx-auto px-4 py-4 text-center text-xs text-gray-400"
            >
                WikiKeeper &mdash; MediaWiki Site Monitoring &mdash;
                <a href="/api" class="hover:text-gray-600">API</a> &middot;
                <a href="/metrics" class="hover:text-gray-600">Metrics</a>
            </div>
        </footer>

        <div
            id="toast-container"
            class="fixed top-16 right-4 z-50 space-y-2"
        ></div>

        <script>
            document.body.addEventListener(
                "htmx:responseError",
                function (evt) {
                    showToast("Request failed", "error");
                },
            );

            function showToast(msg, type) {
                const c = document.getElementById("toast-container");
                const colors = {
                    info: "bg-blue-500",
                    success: "bg-green-500",
                    error: "bg-red-500",
                    warning: "bg-yellow-500 text-black",
                };
                const d = document.createElement("div");
                d.className =
                    (colors[type] || colors.info) +
                    " text-white px-4 py-2 rounded shadow-lg text-sm fade-in";
                d.textContent = msg;
                c.appendChild(d);
                setTimeout(() => {
                    d.style.opacity = "0";
                    d.style.transition = "opacity .3s";
                    setTimeout(() => d.remove(), 300);
                }, 3000);
            }

            function toast(msg, type) {
                showToast(msg, type || "info");
            }
        </script>
        {{block "scripts" .}}{{end}}
    </body>
</html>
{{end}}
