{{define "content"}}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex items-center gap-3">
        <a href="/wikis" class="text-gray-400 hover:text-gray-600">&larr; Back</a>
        <h1 class="text-2xl font-bold text-gray-900">Add Wiki</h1>
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
        <form hx-post="/wikis" hx-target="#add-result" hx-swap="innerHTML"
              class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Wiki URL <span class="text-red-500">*</span></label>
                <input type="url" name="url" required placeholder="https://example.com/wiki/" 
                       class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                <p class="text-xs text-gray-500 mt-1">Can be a wiki URL or direct /api.php endpoint</p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Wiki Name (optional)</label>
                <input type="text" name="wiki_name" placeholder="My Wiki"
                       class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
            </div>
            <button type="submit" class="bg-primary-600 text-white px-6 py-2 rounded text-sm font-medium hover:bg-primary-700">
                Add Wiki
            </button>
            <div id="add-result"></div>
        </form>
    </div>
</div>
{{end}}
