# Development environment
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: wikikeeper-postgres-dev
    environment:
      POSTGRES_DB: wikikeeper
      POSTGRES_USER: wikikeeper
      POSTGRES_PASSWORD: wikikeeper123
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    shm_size: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikikeeper"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: wikikeeper-backend-dev
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: wikikeeper
      DB_PASSWORD: wikikeeper123
      DB_NAME: wikikeeper
      PORT: 8000
      HOST: 0.0.0.0
      LOG_LEVEL: DEBUG
      HTTP_TIMEOUT: 30.0
      ADMIN_TOKEN: test
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_deps:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: wikikeeper-adminer-dev
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_dev_data:
    driver: local
  backend_deps:
    driver: local
