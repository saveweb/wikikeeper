services:
  postgres:
    image: postgres:16-alpine
    container_name: wikikeeper-postgres
    environment:
      TZ: UTC
      POSTGRES_DB: wikikeeper
      POSTGRES_USER: wikikeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wikikeeper123}
    command: ["postgres", "-c", "timezone=UTC"]
    # ports:
    #   - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikikeeper"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 2g

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wikikeeper-backend
    environment:
      TZ: UTC
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: wikikeeper
      DB_PASSWORD: ${POSTGRES_PASSWORD:-wikikeeper123}
      DB_NAME: wikikeeper
      PORT: 8000
      HOST: 0.0.0.0
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-30.0}
      HTTP_USER_AGENT: ${HTTP_USER_AGENT:-WikiKeeper/0.3.0 (https://wikikeeper.saveweb.org/)}
      PROVIDER_REQUEST_INTERVAL: ${PROVIDER_REQUEST_INTERVAL:-0.5}
      FANDOM_REQUEST_INTERVAL: ${FANDOM_REQUEST_INTERVAL:-5.0}
      SITEINFO_CHECK_BATCH_SIZE: ${SITEINFO_CHECK_BATCH_SIZE:-100}
      ARCHIVE_CHECK_BATCH_SIZE: ${ARCHIVE_CHECK_BATCH_SIZE:-100}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-}
    ports:
      - "127.0.0.82:8732:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
